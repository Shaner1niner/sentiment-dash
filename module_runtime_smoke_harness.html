<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SETA Module Runtime Smoke Harness</title>
  <script defer src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="dashboard_fix26_base.css?v=module_runtime_smoke_harness_002"/>
  <style>
    body {
      margin: 0;
      background: #05070a;
      color: #c9d1d9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .harnessShell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }
    .harnessBanner {
      border: 1px solid rgba(125, 211, 252, 0.35);
      background: rgba(13, 17, 23, 0.85);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .harnessBanner h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.2;
    }
    .harnessBanner p {
      margin: 0;
      color: #8b949e;
      font-size: 13px;
    }
    #chart {
      min-height: 720px;
      border: 1px solid rgba(125, 211, 252, 0.22);
      border-radius: 14px;
      background: #0d1117;
      margin-top: 14px;
    }
    #ui-feedback {
      display: inline-block;
      margin-left: 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="harnessShell">
    <div class="harnessBanner">
      <h1>SETA Module Runtime Smoke Harness <span id="ui-feedback">BTC</span></h1>
      <p>Non-production module test surface. Production public/member embeds remain on <code>dashboard_fix26_app.js</code>.</p>
    </div>

    <div class="controls">
      <div class="control" data-control="asset"><label data-label-for="asset">ASSET</label><select id="asset"></select></div>
      <div class="control" data-control="freq"><label data-label-for="freq">FREQUENCY</label><select id="freq"><option value="D">Daily</option><option value="W">Weekly</option></select></div>
      <div class="control" data-control="range"><label data-label-for="range">DISPLAY RANGE</label><select id="range"><option value="1M">1M</option><option value="3M" selected>3M</option><option value="6M">6M</option><option value="YTD">YTD</option><option value="1Y">1Y</option><option value="All">All</option></select></div>
      <div class="control" data-control="briefingMode"><label data-label-for="briefingMode">VIEW</label><select id="briefingMode"><option value="briefing" selected>Briefing</option><option value="research">Research</option></select></div>
      <div class="control" data-control="priceDisplay"><label data-label-for="priceDisplay">CHART TYPE</label><select id="priceDisplay"><option value="candles" selected>Candles</option><option value="line">Line</option></select></div>
      <div class="control" data-control="scaleMode"><label data-label-for="scaleMode">SCALE MODE</label><select id="scaleMode"><option value="price_overlays" selected>Price + Price Overlays</option><option value="price_only">Price Only</option><option value="all_visible">All Visible Traces</option></select></div>
      <div class="control" data-control="ribbon"><label data-label-for="ribbon">RIBBON</label><select id="ribbon"><option value="none" selected>None</option><option value="price">Price</option><option value="sentiment">Sentiment</option><option value="both">Both</option></select></div>
      <div class="control" data-control="sentRibbon"><label data-label-for="sentRibbon">SENTIMENT RIBBON</label><select id="sentRibbon"><option value="curated" selected>Curated</option><option value="full">Full</option></select></div>
      <div class="control" data-control="regimeLayer"><label data-label-for="regimeLayer">REGIME VISUALS</label><select id="regimeLayer"><option value="on" selected>On</option><option value="off">Off</option></select></div>
      <div class="control" data-control="engagement"><label data-label-for="engagement">ATTENTION</label><select id="engagement"><option value="off">Off</option><option value="context" selected>Context</option><option value="overlay">Overlay Marks</option></select></div>
      <div class="control" data-control="bollinger"><label data-label-for="bollinger">BANDS</label><select id="bollinger"><option value="none" selected>None</option><option value="price">Price</option><option value="sentiment">Sentiment Envelope</option><option value="contextual">Combined Overlap</option><option value="overlap">Canonical Overlap</option><option value="both">All Bands</option></select></div>
      <div class="control" data-control="osc"><label data-label-for="osc">TIMING VIEW</label><select id="osc"><option value="price">Price Only</option><option value="both" selected>Price + Sentiment</option></select></div>
    </div>

    <div id="chart"></div>

    <script>
      window.DASH_MODE_DEFAULT = "member";
      window.DASH_MANIFEST_URL = "dashboard_fix26_mode_manifest.json?v=module_runtime_smoke_harness_002";
    </script>
    <script type="module" src="./src/dashboard_main.js?v=module_runtime_smoke_harness_002"></script>
  </div>
</body>
</html>
